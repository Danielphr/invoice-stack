# Server-specific values come from the environment, see docs/deployment.md.
service: invoice_stack
image: invoice_stack

servers:
  web:
    - <%= ENV.fetch("KAMAL_HOST") %>

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
  proxy_command: "cloudflared access ssh --hostname %h"
  forward_agent: false

proxy:
  host: <%= ENV.fetch("APP_HOST") %>
  run:
    bind_ips:
      - 127.0.0.1

registry:
  server: localhost:5555

builder:
  arch: amd64

env:
  secret:
    - RAILS_MASTER_KEY
    - INVOICE_STACK_DATABASE_PASSWORD
    - CLOUDFLARE_ACCESS_TEAM_DOMAIN
    - CLOUDFLARE_ACCESS_AUD
  clear:
    APP_HOST: <%= ENV.fetch("APP_HOST") %>
    DB_HOST: invoice_stack-db
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "invoice_stack_storage:/rails/storage"

asset_path: /rails/public/assets

# Booting takes about a minute on a small server: the entrypoint runs db:prepare, then starts Puma.
deploy_timeout: 120

logging:
  options:
    max-size: 10m
    max-file: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

accessories:
  db:
    image: postgres:17
    host: <%= ENV.fetch("KAMAL_HOST") %>
    env:
      clear:
        POSTGRES_USER: invoice_stack
        POSTGRES_DB: invoice_stack_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
