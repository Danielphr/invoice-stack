<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Change not saved · InvoiceStack</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f9fafb;
        color: #011640;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }

      main { width: 100%; max-width: 28rem; text-align: center; }

      img { height: 2.5rem; width: auto; }

      .code { margin: 2.5rem 0 0; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.05em; color: #58148f; }

      h1 { margin: 0.5rem 0 0; font-size: 1.875rem; line-height: 1.2; letter-spacing: -0.02em; }

      p.message { margin: 1rem 0 0; color: #4a5565; }

      a.button {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.5rem 0.875rem;
        border-radius: 0.375rem;
        background: #58148f;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }

      a.button:hover { background: #9c42e5; }

      a.button:focus-visible { outline: 2px solid #58148f; outline-offset: 2px; }
    </style>
  </head>

  <body>
    <main>
      <img src="/logo.svg" alt="InvoiceStack">
      <p class="code">422 · Unprocessable Content</p>
      <h1>Change not saved</h1>
      <p class="message">Your change couldn't be saved. The page may have expired, so go back, reload it and try again.</p>
      <a class="button" href="/">Go to InvoiceStack</a>
    </main>
  </body>
</html>
